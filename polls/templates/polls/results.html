{% extends "polls/base.html" %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto; padding: 2rem; border: 1px solid #e2e8f0; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #ffffff; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">

    <h1 style="font-size: 1.75rem; color: #1a202c; margin-top: 0; margin-bottom: 1.5rem; line-height: 1.2;">
        {{ question.question_text }}
    </h1>

    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        {% for choice in question.choice_set.all %}
        <div style="position: relative;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-weight: 600; color: #4a5568;">
                <span style="font-size: 1rem;">{{ choice.choice_text }}</span>
                <span style="font-size: 0.9rem; color: #718096;">
                    {{ choice.votes }} vote{{ choice.votes|pluralize }}
                </span>
            </div>
            <div style="width: 100%; height: 12px; background-color: #edf2f7; border-radius: 10px; overflow: hidden;">
                <div style="width: {{  choice.get_percent }}%; height: 100%; background-color: black; border-radius: 10px;"></div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div style="margin-top: 2.5rem; border-top: 1px solid #edf2f7; padding-top: 1.5rem; display: flex; align-items: center; justify-content: space-between;">
        <a href="{% url 'polls:detail' question.id %}" style="text-decoration: none; background-color: #f7fafc; color: #4a5568; padding: 8px 16px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.9rem; font-weight: 500;">
            ← Vote again
        </a>
        
        <span style="font-size: 0.85rem; color: #a0aec0; font-style: italic;">
            Live results
        </span>
    </div>
</div>
{% endblock %}
